<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>拼豆轉化器</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:#f5f5f7;color:#171717}.wrap{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px #0000000c}h1{font-size:26px;margin:4px 0 6px}.sub{color:#666;font-size:14px;margin-bottom:16px}.upload{display:block;border:2px dashed #bbb;border-radius:16px;padding:24px;text-align:center;font-weight:700;cursor:pointer}.upload input{display:none}.preview{width:100%;max-height:320px;object-fit:contain;border-radius:12px;margin-top:12px;display:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}label.small{font-size:13px;color:#555;display:block;margin-bottom:5px}select,button{width:100%;min-height:48px;border-radius:12px;border:1px solid #ddd;background:#fff;font-size:16px;padding:10px}button.primary{background:#111827;color:#fff;border:0;font-weight:700;margin-top:12px}button:disabled{opacity:.45}.canvasWrap{overflow:auto;-webkit-overflow-scrolling:touch;background:#eee;border-radius:14px;padding:8px;display:none}canvas{display:block;background:white;image-rendering:pixelated;margin:auto;touch-action:pan-x pan-y}.stats{display:none}.pill{display:inline-block;background:#eee;border-radius:99px;padding:6px 10px;font-size:13px;margin:3px}.sw{width:18px;height:18px;border-radius:5px;display:inline-block;vertical-align:middle;border:1px solid #bbb;margin-right:7px}.statrow{display:flex;justify-content:space-between;align-items:center;padding:9px 2px;border-bottom:1px solid #eee;font-size:14px}.notice{font-size:13px;color:#666;line-height:1.5}.ok{color:#087f5b;font-weight:600}@media(max-width:480px){.wrap{padding:12px}.card{border-radius:16px;padding:14px}h1{font-size:24px}}</style></head><body><main class="wrap"><section class="card"><h1>🧩 拼豆轉化器</h1><div class="sub">手機測試版 V0.2 · 照片只在你的瀏覽器內處理</div><label class="upload">📷 選擇照片<input id="file" type="file" accept="image/*"></label><img id="preview" class="preview" alt="照片預覽"><div class="row"><div><label class="small">拼豆尺寸</label><select id="size"><option value="29">29 × 29</option><option value="35" selected>35 × 35</option><option value="50">50 × 50</option></select></div><div><label class="small">最多使用顏色</label><select id="limit"><option value="0">不限</option><option value="24">24 色</option><option value="16" selected>16 色</option><option value="12">12 色</option><option value="8">8 色</option></select></div></div><button id="go" class="primary" disabled>產生拼豆圖</button><div class="notice" style="margin-top:10px"><span class="ok">✓ 本機處理</span>　目前使用 MARD 36 色測試色庫；正式 221 色資料會獨立更新。</div></section><section class="card canvasWrap" id="cw"><canvas id="out"></canvas></section><section class="card stats" id="stats"><div id="summary"></div><div id="list"></div><button id="save" style="margin-top:12px">下載 PNG</button></section></main><script>const P=[['A1','#FAF4C8'],['A3','#F7E36C'],['A4','#F6C84C'],['A6','#E79B3A'],['A7','#C87332'],['B5','#F39AA8'],['B6','#EA657C'],['B8','#D83D5D'],['B10','#A92548'],['C1','#D9EEF7'],['C2','#9DD8EF'],['C3','#57B9DE'],['C6','#3983C6'],['C7','#285AA8'],['C8','#233D78'],['D1','#D8E8C7'],['D2','#9DD080'],['D7','#45A66A'],['D8','#28764D'],['E2','#F6C9D9'],['E4','#D997C1'],['E5','#B96DA8'],['E6','#854C8E'],['F3','#D6C1A6'],['F5','#A37B5B'],['G1','#FFFFFF'],['G5','#C7C7C7'],['G7','#777777'],['G8','#252525'],['G13','#D9D1C3'],['H1','#F1D7B7'],['H2','#E8B98D'],['H9','#C98A65'],['H3','#B87352'],['H5','#89513F'],['H7','#5B3A31']].map(([code,hex])=>({code,hex,r:parseInt(hex.slice(1,3),16),g:parseInt(hex.slice(3,5),16),b:parseInt(hex.slice(5,7),16)}));function ok(r,g,b){r/=255;g/=255;b/=255;const f=x=>x<=.04045?x/12.92:Math.pow((x+.055)/1.055,2.4);r=f(r);g=f(g);b=f(b);const l=Math.cbrt(.4122214708*r+.5363325363*g+.0514459929*b),m=Math.cbrt(.2119034982*r+.6806995451*g+.1073969566*b),s=Math.cbrt(.0883024619*r+.2817188376*g+.6299787005*b);return [.2104542553*l+.793617785*m-.0040720468*s,1.9779984951*l-2.428592205*m+.4505937099*s,.0259040371*l+.7827717662*m-.808675766*s]}P.forEach(p=>p.o=ok(p.r,p.g,p.b));const dist=(a,b)=>(a[0]-b[0])**2+(a[1]-b[1])**2+(a[2]-b[2])**2;const nearest=(o,pal)=>{let q=pal[0],d=1e9;for(const p of pal){const x=dist(o,p.o);if(x<d){d=x;q=p}}return q};let img=null,grid=null,n=35;const file=document.querySelector('#file'),prev=document.querySelector('#preview'),go=document.querySelector('#go'),cv=document.querySelector('#out'),ctx=cv.getContext('2d'),cw=document.querySelector('#cw'),stats=document.querySelector('#stats');file.onchange=e=>{const f=e.target.files[0];if(!f)return;const u=URL.createObjectURL(f);const im=new Image;im.onload=()=>{img=im;prev.src=u;prev.style.display='block';go.disabled=false};im.src=u};go.onclick=()=>{n=+document.querySelector('#size').value;const lim=+document.querySelector('#limit').value;const tmp=document.createElement('canvas');tmp.width=n;tmp.height=n;const t=tmp.getContext('2d',{willReadFrequently:true});const side=Math.min(img.naturalWidth,img.naturalHeight),sx=(img.naturalWidth-side)/2,sy=(img.naturalHeight-side)/2;t.drawImage(img,sx,sy,side,side,0,0,n,n);const data=t.getImageData(0,0,n,n).data,raw=[];for(let i=0;i<n*n;i++)raw.push(nearest(ok(data[i*4],data[i*4+1],data[i*4+2]),P));let pal=P;if(lim){const counts={};raw.forEach(p=>counts[p.code]=(counts[p.code]||0)+1);const codes=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,lim).map(x=>x[0]);pal=P.filter(p=>codes.includes(p.code))}grid=[];for(let i=0;i<n*n;i++){const o=ok(data[i*4],data[i*4+1],data[i*4+2]);grid.push(nearest(o,pal))}draw();showStats()};function draw(){const cell=n<=35?20:14;cv.width=n*cell+1;cv.height=n*cell+1;for(let y=0;y<n;y++)for(let x=0;x<n;x++){ctx.fillStyle=grid[y*n+x].hex;ctx.fillRect(x*cell,y*cell,cell,cell)}for(let i=0;i<=n;i++){ctx.beginPath();ctx.strokeStyle=i%5===0?'#222':'#999';ctx.lineWidth=i%5===0?1.8:.45;ctx.moveTo(i*cell,0);ctx.lineTo(i*cell,n*cell);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*cell);ctx.lineTo(n*cell,i*cell);ctx.stroke()}cw.style.display='block';cw.scrollIntoView({behavior:'smooth'})}function showStats(){const c={};grid.forEach(p=>c[p.code]=(c[p.code]||0)+1);const arr=Object.entries(c).sort((a,b)=>b[1]-a[1]);document.querySelector('#summary').innerHTML=`<span class="pill">${n} × ${n}</span><span class="pill">共 ${n*n} 顆</span><span class="pill">使用 ${arr.length} 色</span>`;document.querySelector('#list').innerHTML=arr.map(([code,num])=>{const p=P.find(x=>x.code===code);return `<div class="statrow"><span><i class="sw" style="background:${p.hex}"></i><b>${code}</b>　${p.hex}</span><b>${num} 顆</b></div>`}).join('');stats.style.display='block'}document.querySelector('#save').onclick=()=>{cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`拼豆圖_${n}x${n}.png`;a.click()},'image/png')};</script></body></html>
